name: CLA marker (reusable)

on:
  workflow_call:
    inputs:
      label_covered:
        description: "Label to apply when CLA is considered covered"
        required: false
        default: "CLA: covered"
        type: string
      label_review:
        description: "Label to apply when CLA status needs review"
        required: false
        default: "CLA: review"
        type: string
      allowlist_users:
        description: "Comma/space-separated GitHub usernames that are CLA-covered by policy"
        required: false
        default: ""
        type: string
      cover_org_members:
        description: "Treat members/owners of the base repository's organization as CLA-covered"
        required: false
        default: true
        type: boolean
      create_missing_labels:
        description: "Create labels if they do not exist"
        required: false
        default: false
        type: boolean
      cover_collaborators:
        description: "Treat repository collaborators as CLA-covered"
        required: false
        default: false
        type: boolean
      cover_invited:
        description: "Treat users with a pending repo/org invitation as CLA-covered"
        required: false
        default: false
        type: boolean

jobs:
  mark:
    if: startsWith(github.event_name, 'pull_request')
    name: Mark CLA status
    permissions:
      contents: read
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate and label PR
        uses: actions/github-script@v7
        with:
          script: |
            const core = require('@actions/core');
            const pr = context.payload.pull_request;
            if (!pr) {
              core.setFailed('This workflow must be triggered from a pull_request* event in the caller.');
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = pr.number;

            const labelCovered = core.getInput('label_covered');
            const labelReview = core.getInput('label_review');
            const coverOrgMembers = core.getBooleanInput('cover_org_members');
            const coverCollaborators = core.getBooleanInput('cover_collaborators');
            const coverInvited = core.getBooleanInput('cover_invited');
            const createMissing = core.getBooleanInput('create_missing_labels');

            const allowUsers = (core.getInput('allowlist_users') || '')
              .split(/[\s,]+/)
              .filter(Boolean)
              .map((s) => s.toLowerCase());

            const prAuthor = (pr.user && pr.user.login) ? pr.user.login : '';
            const association = (pr.author_association || '').toUpperCase();

            const isAllowlistedAuthor = allowUsers.includes(prAuthor.toLowerCase());
            const isOrgMemberAuthor = coverOrgMembers && ['MEMBER', 'OWNER'].includes(association);
            const isCollaborator = coverCollaborators && association === 'COLLABORATOR';

            // Treat users with a pending invitation (to this repo, or to the org) as covered.
            // "have an invite from this account" — TEX-23.
            async function hasPendingInvite(login) {
              if (!login) return false;
              const wanted = login.toLowerCase();
              try {
                const repoInvites = await github.paginate(
                  github.rest.repos.listInvitations,
                  { owner, repo, per_page: 100 }
                );
                if (repoInvites.some((i) => (i.invitee?.login || '').toLowerCase() === wanted)) {
                  return true;
                }
              } catch (err) {
                core.warning(`Could not list repo invitations: ${err.message}`);
              }
              try {
                const orgInvites = await github.paginate(
                  github.rest.orgs.listPendingInvitations,
                  { org: owner, per_page: 100 }
                );
                if (orgInvites.some((i) => (i.login || '').toLowerCase() === wanted)) {
                  return true;
                }
              } catch (err) {
                // Owner may be a user account (no org); that's fine — just skip.
                core.info(`Skipping org invitation check: ${err.message}`);
              }
              return false;
            }

            const isInvited = coverInvited && await hasPendingInvite(prAuthor);
            const covered = isAllowlistedAuthor || isOrgMemberAuthor || isCollaborator || isInvited;

            core.info(`PR #${issue_number} by @${prAuthor} (association=${association}, invited=${isInvited}) -> covered=${covered}`);

            // Ensure labels exist (create if missing)
            if (createMissing) {
              async function ensureLabel(name, color, description) {
                try {
                  await github.rest.issues.getLabel({ owner, repo, name });
                } catch (err) {
                  if (err.status === 404) {
                    await github.rest.issues.createLabel({ owner, repo, name, color, description });
                  } else {
                    throw err;
                  }
                }
              }

              await Promise.all([
                ensureLabel(labelCovered, '2ea44f', 'Contributor License Agreement is considered covered'),
                ensureLabel(labelReview, '9a9a9a', 'CLA status requires manual review')
              ]);
            }

            // Remove the opposite label if present, then add the desired one
            const desired = covered ? labelCovered : labelReview;
            const other = covered ? labelReview : labelCovered;

            // remove other label if present
            try {
              await github.rest.issues.removeLabel({ owner, repo, issue_number, name: other });
            } catch (err) {
              if (err.status !== 404) {
                core.warning(`Could not remove label '${other}': ${err.message}`);
              }
            }

            // add desired label (idempotent)
            await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [desired] });

            core.summary
              .addHeading('CLA marker')
              .addTable([
                [{data: 'PR', header: true}, {data: '#'+issue_number, header: false}],
                ['Author', '@'+prAuthor],
                ['Association', association || ''],
                ['Allowlisted users', allowUsers.join(', ') || '(none)'],
                ['Treat org members as covered', String(coverOrgMembers)],
                ['Treat invited users as covered', String(coverInvited)],
                ['Pending invite found', String(isInvited)],
                ['Result', covered ? labelCovered : labelReview],
              ])
              .write();
